name: BoringCache Cargo validation
'on':
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: boringcache-cargo-validation
  cancel-in-progress: false
jobs:
  cold:
    name: BoringCache Cargo ${{ matrix.case }} cold
    if: github.repository_owner == 'boringcache' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        case:
        - workspace
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CC: cc
      CXX: c++
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Record source identity
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cargo-validation"
        git rev-parse HEAD > "$RUNNER_TEMP/cargo-validation/workflow-commit.txt"
        cp .github/boringcache-source "$RUNNER_TEMP/cargo-validation/upstream-commit.txt"
        cp .boringcache.toml "$RUNNER_TEMP/cargo-validation/cache-plan.toml"
        git status --porcelain > "$RUNNER_TEMP/cargo-validation/checkout.txt"
        test ! -s "$RUNNER_TEMP/cargo-validation/checkout.txt"
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: 1.97.1
    - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
      with:
        tool: sccache@0.17.0,cargo-nextest@0.9.143
    - name: Install native prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install --yes pkg-config libssl-dev cmake protobuf-compiler
        rustc -Vv
        cargo -V
        sccache --version
    - name: Run first-class Cargo
      id: cargo
      uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
      with:
        cli-version: ${{ inputs.cli_version }}
        mode: cargo
        trust-policy: publish
        fail-on-cache-error: true
    - name: Run workspace doctests
      run: boringcache cargo --write --skip-restore test --locked --doc --workspace --exclude marty-zkp --exclude
        marty-bindings --features test-fixtures
    - name: Retain Cargo evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cargo-${{ matrix.case }}-cold
        path: |
          ${{ runner.temp }}/cargo-validation
          ${{ steps.cargo.outputs.evidence-path }}
        retention-days: 30
        if-no-files-found: error
  warm:
    name: BoringCache Cargo ${{ matrix.case }} warm
    needs: cold
    if: github.repository_owner == 'boringcache' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        case:
        - workspace
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CC: cc
      CXX: c++
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Record source identity
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cargo-validation"
        git rev-parse HEAD > "$RUNNER_TEMP/cargo-validation/workflow-commit.txt"
        cp .github/boringcache-source "$RUNNER_TEMP/cargo-validation/upstream-commit.txt"
        cp .boringcache.toml "$RUNNER_TEMP/cargo-validation/cache-plan.toml"
        git status --porcelain > "$RUNNER_TEMP/cargo-validation/checkout.txt"
        test ! -s "$RUNNER_TEMP/cargo-validation/checkout.txt"
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: 1.97.1
    - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
      with:
        tool: sccache@0.17.0,cargo-nextest@0.9.143
    - name: Install native prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install --yes pkg-config libssl-dev cmake protobuf-compiler
        rustc -Vv
        cargo -V
        sccache --version
    - name: Run first-class Cargo
      id: cargo
      uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
      with:
        cli-version: ${{ inputs.cli_version }}
        mode: cargo
        trust-policy: restore
        fail-on-cache-error: true
    - name: Run workspace doctests
      run: boringcache cargo --read-only --skip-restore test --locked --doc --workspace --exclude marty-zkp --exclude
        marty-bindings --features test-fixtures
    - name: Retain Cargo evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cargo-${{ matrix.case }}-warm
        path: |
          ${{ runner.temp }}/cargo-validation
          ${{ steps.cargo.outputs.evidence-path }}
        retention-days: 30
        if-no-files-found: error
